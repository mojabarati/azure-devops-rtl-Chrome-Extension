<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Azure DevOps RTL Fixer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand">
        <img
          src="../../icons/icon48.png"
          alt=""
          class="app-logo"
          width="44"
          height="44"
        >
        <div class="brand-copy">
          <h1>Azure DevOps RTL Fixer</h1>
          <p>Persian and RTL support</p>
        </div>
      </header>

      <section class="platforms" aria-labelledby="platforms-heading">
        <h2 id="platforms-heading">Platforms</h2>
        <div class="platform-card">
          <label class="platform-row" for="azure-toggle">
            <span class="platform-copy">
              <span id="azure-label" class="platform-name">Azure DevOps</span>
              <span id="azure-description" class="platform-description">Work items and rich text</span>
            </span>
            <span class="platform-setting">
              <span id="azure-state" class="state-label">Off</span>
              <span class="switch">
                <input
                  id="azure-toggle"
                  type="checkbox"
                  role="switch"
                  aria-labelledby="azure-label azure-state"
                  aria-describedby="azure-description"
                  disabled
                >
                <span class="slider" aria-hidden="true"></span>
              </span>
            </span>
          </label>

          <label class="platform-row" for="github-toggle">
            <span class="platform-copy">
              <span id="github-label" class="platform-name">GitHub</span>
              <span id="github-description" class="platform-description">Rendered Markdown</span>
            </span>
            <span class="platform-setting">
              <span id="github-state" class="state-label">Off</span>
              <span class="switch">
                <input
                  id="github-toggle"
                  type="checkbox"
                  role="switch"
                  aria-labelledby="github-label github-state"
                  aria-describedby="github-description"
                  disabled
                >
                <span class="slider" aria-hidden="true"></span>
              </span>
            </span>
          </label>
        </div>
      </section>

      <section id="status" class="status-card" role="status" aria-live="polite" aria-atomic="true">
        <span class="status-indicator" aria-hidden="true"></span>
        <span class="status-copy">
          <span id="status-title" class="status-title">Checking this page&hellip;</span>
          <span id="status-message" class="status-message">Your saved preferences are still available.</span>
        </span>
      </section>

      <p class="privacy-note">
        RTL analysis happens locally on your device. Reporting an issue opens Gmail only when you choose to do so.
      </p>

      <a
        id="report-issue"
        class="report-issue"
        href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=mojabarati%40gmail.com&amp;su=Azure%20DevOps%20RTL%20Fixer%20-%20Issue%20Report"
        target="_blank"
        rel="noopener"
        aria-label="Report an issue with Azure DevOps RTL Fixer"
      >
        <svg class="report-icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
          <path d="M3.25 5.5A1.75 1.75 0 0 1 5 3.75h10A1.75 1.75 0 0 1 16.75 5.5v9A1.75 1.75 0 0 1 15 16.25H5a1.75 1.75 0 0 1-1.75-1.75v-9Z"></path>
          <path d="m4 5 6 4.75L16 5"></path>
        </svg>
        <span class="report-copy">
          <span class="report-title">Report an issue</span>
          <span class="report-description">Opens a Gmail draft for you to review.</span>
        </span>
        <svg class="report-arrow" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="m6 3.5 4.5 4.5L6 12.5"></path>
        </svg>
      </a>
    </main>
    <script src="../shared/preferences.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
